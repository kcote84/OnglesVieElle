<script>
(function () {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Année du pied de page ---------- */
  var yr = document.getElementById("yr");
  if (yr) { yr.textContent = new Date().getFullYear(); }

  /* ---------- En-tête : état « collé » + barre mobile ---------- */
  var hdr = document.getElementById("hdr");
  var dock = document.getElementById("dock");
  var lastY = 0;
  function onScroll() {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (hdr) { hdr.classList.toggle("is-stuck", y > 12); }
    if (dock) { dock.classList.toggle("is-shown", y > 420); }
    lastY = y;
  }
  var ticking = false;
  window.addEventListener("scroll", function () {
    if (!ticking) {
      window.requestAnimationFrame(function () { onScroll(); ticking = false; });
      ticking = true;
    }
  }, { passive: true });
  onScroll();

  /* ---------- Menu mobile (piège de focus + Échap) ---------- */
  var burger = document.getElementById("burger");
  var drawer = document.getElementById("drawer");
  var lastFocus = null;

  function focusables(root) {
    return Array.prototype.slice.call(
      root.querySelectorAll('a[href], button:not([disabled]), input, [tabindex]:not([tabindex="-1"])')
    ).filter(function (el) { return el.offsetParent !== null; });
  }
  function openDrawer() {
    if (!drawer || !burger) return;
    lastFocus = document.activeElement;
    drawer.hidden = false;
    /* force le reflow pour que la transition démarre */
    void drawer.offsetWidth;
    drawer.classList.add("is-open");
    burger.setAttribute("aria-expanded", "true");
    burger.setAttribute("aria-label", "Fermer le menu");
    document.body.style.overflow = "hidden";
    var f = focusables(drawer);
    if (f.length) { f[0].focus(); }
  }
  function closeDrawer() {
    if (!drawer || !burger) return;
    drawer.classList.remove("is-open");
    burger.setAttribute("aria-expanded", "false");
    burger.setAttribute("aria-label", "Ouvrir le menu");
    document.body.style.overflow = "";
    window.setTimeout(function () { drawer.hidden = true; }, reduce ? 0 : 320);
    if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
  }
  if (burger) {
    burger.addEventListener("click", function () {
      if (burger.getAttribute("aria-expanded") === "true") { closeDrawer(); } else { openDrawer(); }
    });
  }
  if (drawer) {
    drawer.addEventListener("click", function (e) {
      var a = e.target.closest ? e.target.closest("a") : null;
      if (a) { closeDrawer(); }
    });
    drawer.addEventListener("keydown", function (e) {
      if (e.key !== "Tab") return;
      var f = focusables(drawer);
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
  }

  /* ---------- Visionneuse d'images ---------- */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");
  var lbCap = document.getElementById("lbCap");
  var lbClose = document.getElementById("lbClose");
  var lbOpener = null;

  function openLb(btn) {
    var img = btn.querySelector("img");
    if (!img || !lb) return;
    lbOpener = btn;
    lbImg.src = img.currentSrc || img.src;
    lbImg.alt = img.alt || "";
    lbCap.textContent = btn.getAttribute("data-cap") || img.alt || "";
    lb.hidden = false;
    void lb.offsetWidth;
    lb.classList.add("is-open");
    document.body.style.overflow = "hidden";
    if (lbClose) { lbClose.focus(); }
  }
  function closeLb() {
    if (!lb) return;
    lb.classList.remove("is-open");
    document.body.style.overflow = "";
    window.setTimeout(function () { lb.hidden = true; lbImg.src = ""; }, reduce ? 0 : 300);
    if (lbOpener && lbOpener.focus) { lbOpener.focus(); }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".gal__item"), function (btn) {
    btn.addEventListener("click", function () { openLb(btn); });
  });
  if (lbClose) { lbClose.addEventListener("click", closeLb); }
  if (lb) {
    lb.addEventListener("click", function (e) { if (e.target === lb) { closeLb(); } });
    lb.addEventListener("keydown", function (e) { if (e.key === "Tab") { e.preventDefault(); if (lbClose) lbClose.focus(); } });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" && e.key !== "Esc") return;
    if (lb && !lb.hidden) { closeLb(); }
    else if (burger && burger.getAttribute("aria-expanded") === "true") { closeDrawer(); }
  });

  /* ---------- Apparition douce au défilement ---------- */
  var items = document.querySelectorAll(".rv");
  if (reduce || !("IntersectionObserver" in window)) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add("is-in"); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-in");
          io.unobserve(entry.target);
        }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
    Array.prototype.forEach.call(items, function (el) { io.observe(el); });
    /* Filet de securite : si l'observateur ne se declenche pas (navigateur
       exotique, onglet en arriere-plan...), on revele ce qui est a l'ecran. */
    var safety = function () {
      Array.prototype.forEach.call(document.querySelectorAll(".rv:not(.is-in)"), function (el) {
        var r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { el.classList.add("is-in"); }
      });
    };
    window.addEventListener("load", safety);
    window.setTimeout(safety, 2500);
  }

  /* ---------- Ancre dans l'URL : on recale sous l'en-tete apres le chargement ---------- */
  window.addEventListener("load", function () {
    if (!location.hash || location.hash.length < 2) return;
    var t;
    try { t = document.querySelector(location.hash); } catch (err) { return; }
    if (!t) return;
    window.setTimeout(function () {
      var offset = (hdr ? hdr.offsetHeight : 0) + 12;
      var root = document.documentElement;
      var prev = root.style.scrollBehavior;
      root.style.scrollBehavior = "auto";      /* saut immediat, pas d'animation */
      window.scrollTo(0, t.getBoundingClientRect().top + window.pageYOffset - offset);
      root.style.scrollBehavior = prev;
    }, 60);
  });

  /* ---------- Défilement doux avec compensation de l'en-tête ---------- */
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (!a) return;
    var id = a.getAttribute("href");
    if (!id || id === "#" || id.length < 2) return;
    var target = document.querySelector(id);
    if (!target) return;
    e.preventDefault();
    var offset = (hdr ? hdr.offsetHeight : 0) + 12;
    var top = target.getBoundingClientRect().top + window.pageYOffset - offset;
    window.scrollTo({ top: top, behavior: reduce ? "auto" : "smooth" });
    if (target.hasAttribute && !target.hasAttribute("tabindex")) { target.setAttribute("tabindex", "-1"); }
    window.setTimeout(function () { try { target.focus({ preventScroll: true }); } catch (err) {} }, reduce ? 0 : 460);
  });
})();
</script>
